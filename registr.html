<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Maison Margiela</title>
    <link rel="stylesheet" href="registr.css">
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <header id="header" class="header">
        <div class="container">
            <div class="logo">
                <h1>Maison Margiela</h1>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="login.html" class="nav-link">Вход</a>
                <a href="registr.html" class="nav-link active">Регистрация</a>
            </nav>
        </div>
    </header>

    <main class="registr-container">
        <div class="registr-form-wrapper">
            <div class="registr-form">
                <h2>Создать Аккаунт</h2>
                <p class="form-subtitle">Присоединитесь к сообществу Maison Margiela</p>
                
                <form id="registrForm">
                    <div class="form-group">
                        <label for="fullName">Полное Имя</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName" 
                            placeholder="Иван Петров" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registrEmail">Email</label>
                        <input 
                            type="email" 
                            id="registrEmail" 
                            name="email" 
                            placeholder="ваш@email.com" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registrPassword">Пароль</label>
                        <input 
                            type="password" 
                            id="registrPassword" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                        >
                        <small class="password-hint">Минимум 6 символов</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Подтвердите Пароль</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон (опционально)</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone" 
                            placeholder="+7 (999) 123-45-67"
                        >
                    </div>

                    <div class="progress-section">
                        <p class="progress-label">Процесс регистрации:</p>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p class="progress-percentage" id="progressPercentage">0%</p>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" name="agreeTerms" required>
                            <span>Я согласен с условиями и политикой конфиденциальности</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span class="btn-text">ЗАРЕГИСТРИРОВАТЬСЯ</span>
                        <span class="btn-loader" style="display:none;">
                            <div class="spinner-small"></div>
                        </span>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Уже есть аккаунт? <a href="login.html" class="link">Войти</a></p>
                </div>

                <div id="successModal" class="success-modal">
                    <div class="success-content">
                        <div class="success-icon">✓</div>
                        <h3>Регистрация Завершена!</h3>
                        <p id="successMessage"></p>
                        <button class="btn-primary" onclick="goToLogin()">Перейти к Входу</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="registr.js"></script>
</body>
</html>
